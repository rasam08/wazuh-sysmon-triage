name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install build twine pytest

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          package_version = version("wazuh-sysmon-triage")
          if tag_version != package_version:
              raise SystemExit(
                  f"tag version {tag_version!r} does not match package version {package_version!r}"
              )
          PY

      - name: Test release commit
        run: python -m pytest -q

      - name: Build Python package
        run: |
          python -m build
          python -m twine check dist/*

      - name: Generate checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
