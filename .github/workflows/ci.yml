name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest pytest-cov ruff mypy types-PyYAML
          python -m pip install vulture
          python -m pip install bandit pip-audit detect-secrets
      - name: Install UI dependencies
        run: |
          npm --prefix ui ci
          npx --prefix ui playwright install --with-deps chromium
      - name: Security gate
        run: |
          python -m bandit -q -r src -lll
          python -m pip_audit --local --skip-editable
          npm --prefix ui audit --audit-level=critical
          python scripts/scan_tracked_secrets.py --repo-root .
      - name: Lint
        run: python -m ruff check src tests
      - name: Type-check
        run: |
          python -m mypy src
          python -m mypy --strict src/wazuh_sysmon_triage/pipeline
      - name: Dead-code gate
        run: |
          python -m vulture src tests --min-confidence 80
          npx --yes knip --directory ui --no-progress
      - name: Python test+cov
        env:
          PYTHONPATH: ./src
        run: >
          python -m pytest -q
          --cov=src/wazuh_sysmon_triage
          --cov-report=term-missing
          --cov-fail-under=80
          --ignore=tests/test_golden_snapshots.py
      - name: UI test
        run: |
          npm --prefix ui run test -- --run
          npm --prefix ui run test:e2e:smoke
      - name: UI build
        run: npm --prefix ui run build
      - name: Snapshot test
        env:
          PYTHONPATH: ./src
        run: python -m pytest -q tests/test_golden_snapshots.py
