name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install build twine pytest pytest-cov ruff mypy types-PyYAML
          python -m pip install vulture
          python -m pip install bandit pip-audit detect-secrets
      - name: Security gate
        run: |
          python -m bandit -q -r src -lll
          python -m pip_audit --local --skip-editable
          python scripts/scan_tracked_secrets.py --repo-root . --include-untracked
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Documentation links
        run: python scripts/check_markdown_links.py
      - name: Type-check
        run: |
          python -m mypy src
          python -m mypy --strict src/wazuh_sysmon_triage/pipeline
      - name: Dead-code gate
        run: python -m vulture src tests --min-confidence 80
      - name: Python test+cov
        env:
          PYTHONPATH: ./src
        run: >
          python -m pytest -q
          --cov=src/wazuh_sysmon_triage
          --cov-report=term-missing
          --cov-fail-under=80
          --ignore=tests/test_golden_snapshots.py
      - name: Snapshot test
        env:
          PYTHONPATH: ./src
        run: python -m pytest -q tests/test_golden_snapshots.py
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Bounded 10k performance gate
        run: >
          python scripts/benchmark_offline.py
          --source-events 10000
          --selected-events 10000
          --repeat 2
          --max-seconds 30
          --max-rss-mib 512
          --report benchmark-report-10k.json
      - name: Retain 10k benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-10k
          path: benchmark-report-10k.json
