# Copy this file to config.local.yaml and replace the lab placeholders.
# config.local.yaml is ignored by Git. Keep passwords out of YAML.

# Wazuh Indexer/OpenSearch API. This is normally port 9200, not the
# Wazuh Dashboards interface on port 443.
host: "https://indexer:9200"
user: "triage-readonly"
verify_tls: true

# The normal Wazuh alert pattern. Use --context-index-pattern with
# triage alert when indexed archives are available for fuller context.
index_pattern: "wazuh-alerts-4.x-*"

# Case bundles are written below this directory.
out_dir: "./out"

# Supported Windows evidence. Security 4624 is further filtered to
# network and remote-interactive logon types 3 and 10.
event_ids: [1, 3, 5, 10, 11, 12, 13, 14, 22, 23, 26, 4624, 4697, 4698]

# Choose one profile by default. The CLI flag --profile overrides this.
active_profile: soc

profiles:
  soc:
    # Replace this with the Wazuh agent name you actually enrolled.
    agent_name: "windows-lab-01"
    alerts_only: true
    print_stats: true
  dev:
    alerts_only: false
    print_stats: true
  lab:
    alerts_only: true
    print_stats: true
    # Convenient for a disposable self-signed lab, but the CLI warns
    # because disabling verification permits MITM attacks.
    verify_tls: false

# If you prefer an ID, put agent_id in the selected profile instead.
# When both agent_id and agent_name are set, the default --agent-mode all
# requires an event to match both selectors.

# Process basenames in this list do not emit local behavior findings.
# Suppression counts remain visible in the case artifacts.
alert_allowlist_basenames:
  - MsMpEng.exe
  - MpCmdRun.exe
  - NisSrv.exe
  - MpDefenderCoreService.exe
  - svchost.exe
  - chrome.exe
  - msedge.exe
  - firefox.exe

# Add narrow environment-specific suppressions rather than broad rules
# that can hide unrelated evidence.
suppressions:
  rules:
    - name: trusted-browser-outbound
      image_glob: '*\chrome.exe'
      destination_class: public
      enabled: true
  allowlist_override:
    - name: keep-lolbin-visible
      image_glob: '*\mshta.exe'
      enabled: true

# Context roles add tags only; they do not change finding strength.
context_roles:
  developer:
    agent_names: ["dev-laptop-01", "dev-laptop-02"]
    users: ['HOST\alice', 'HOST\bob']
    process_image_contains: ['\.vscode\', powershelleditorservices]

# Optional automatic pruning under out_dir. Review these values against
# your evidence-retention policy before enabling them.
artifact_retention:
  enabled: false
  max_age_days: 30
  max_total_size_mb: 2048
  min_keep_runs: 10

# Optional fixed UTC window. Most interactive runs are easier with
# --last, --today, or --yesterday.
# start: "2026-08-18T00:00:00Z"
# end: "2026-08-18T02:00:00Z"

# Set the password in the current shell or a secret manager:
#
#   $env:WAZUH_OS_PASSWORD = "<password>"
#   triage live --last 2h --case-id LAB-001
#
# The CLI also reads WAZUH_OS_HOST, WAZUH_OS_USER, and
# WAZUH_OS_VERIFY_TLS. It does not automatically load .env files.
#
# If the Indexer is only reachable from its host:
#
#   ssh -N -L 9920:localhost:9200 <user>@<wazuh-indexer>
#   $env:WAZUH_OS_HOST = "https://127.0.0.1:9920"
#   triage live --last 15m --case-id LAB-TUNNEL --no-verify-tls
