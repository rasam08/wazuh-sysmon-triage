# config.example.yaml
# rename this file to `config.local.yaml` and update the values as needed for your environment. Do NOT commit sensitive information to version control. Use environment variables or other secure methods to handle secrets in production environments.
# Example configuration for the wazuh-sysmon-triage tool

## Time window
## - You may set `start`/`end` here OR provide them on the CLI.
## - ISO8601 UTC examples: "2026-02-10T00:00:00Z"
start: "2026-02-10T00:00:00Z"
end: "2026-02-10T02:00:00Z"

## Agent filter (use either)
agent_id: "MyAgentID"
agent_name: "MyAgentName"

## Output
out_dir: "./out"

## OpenSearch / Wazuh Indexer API endpoint
## Note: Wazuh Dashboards/UI is typically :443; Indexer API is often :9920.
host: "https://indexer:9920"
user: "admin"
pass: "<password>"
verify_tls: true

## Index selection
index_pattern: "wazuh-alerts-4.x-*"

## Supported Sysmon Event IDs
event_ids: [1, 3, 11]

# You can also omit host/user/pass here and instead set these environment variables:
#   WAZUH_OS_HOST, WAZUH_OS_USER, WAZUH_OS_PASSWORD

# Example command using this config:
#
#   $env:WAZUH_OS_PASSWORD = "<password>"
#   python -m wazuh_sysmon_triage run --config config.example.yaml --case-id INCIDENT-EXAMPLE-001 --print-stats
#
# Recommended (PowerShell one-liner, dynamic 2-hour window, venv interpreter):
#
#   $env:WAZUH_OS_HOST = "https://127.0.0.1:9920"; $start = (Get-Date).AddHours(-2).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"); $end = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"); & ".\.venv\Scripts\python.exe" -m wazuh_sysmon_triage run --config .\config.local.yaml --start $start --end $end --case-id "incident-002-eid1-3-11" --agent-name "anon" --no-verify-tls --event-id 1 --event-id 3 --event-id 11
#
# If you are using an SSH tunnel to reach a localhost-bound indexer:
#
#   ssh -N -L 9920:localhost:9920 <user>@<wazuh-server>
#   $env:WAZUH_OS_HOST = "https://127.0.0.1:9920"
#   python -m wazuh_sysmon_triage run --no-verify-tls --config config.example.yaml --case-id INCIDENT-TUNNEL-EXAMPLE-001