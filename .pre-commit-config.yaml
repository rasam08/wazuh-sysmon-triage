repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--config=pyproject.toml]
      - id: ruff-format
        args: [--config=pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: [src]
        pass_filenames: false
        additional_dependencies: [types-PyYAML]

  - repo: local
    hooks:
      - id: markdown-links
        name: Local Markdown links
        entry: python scripts/check_markdown_links.py
        language: system
        pass_filenames: false
      - id: pytest-cov
        name: Python test+cov
        entry: python -m pytest -q --cov=src/wazuh_sysmon_triage --cov-report=term-missing --cov-fail-under=80 --ignore=tests/test_golden_snapshots.py
        language: system
        pass_filenames: false
      - id: mypy-pipeline-strict
        name: mypy-pipeline-strict
        entry: python -m mypy --strict src/wazuh_sysmon_triage/pipeline
        language: system
        pass_filenames: false
      - id: snapshot-test
        name: Snapshot test
        entry: python -m pytest -q tests/test_golden_snapshots.py
        language: system
        pass_filenames: false
