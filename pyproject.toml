[tool.poetry]
name = "wazuh-sysmon-triage"
version = "1.0.0"
description = "A CLI tool for triaging Sysmon data in Wazuh."
authors = ["Rasam Moghaddam"]
homepage = "https://github.com/rasam08"
license = "MIT"
readme = "README.md"
keywords = ["wazuh", "sysmon", "cli", "triage"]
include = [
	{ path = "src/wazuh_sysmon_triage/py.typed", format = ["sdist", "wheel"] }
]

packages = [
	{ include = "wazuh_sysmon_triage", from = "src" }
]

[tool.poetry.scripts]
wazuh-sysmon-triage = "wazuh_sysmon_triage.__main__:main"
triage = "wazuh_sysmon_triage.__main__:main"

[tool.poetry.dependencies]
python = ">=3.12"
typer = "^0.4.0"
pydantic = ">=2.0"
httpx = ">=0.23.0"
pyyaml = "^6.0"
click = "<8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.8"
mypy = "^1.11.0"
pre-commit = "^4.2.0"
types-PyYAML = "*"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
