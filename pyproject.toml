[tool.poetry]
name = "wazuh-sysmon-triage"
version = "2.0.0"
description = "Deterministic CLI triage for Windows endpoint telemetry collected by Wazuh."
authors = ["Rasam Moghaddam <rasammgg@gmail.com>"]
homepage = "https://github.com/rasam08/wazuh-sysmon-triage"
repository = "https://github.com/rasam08/wazuh-sysmon-triage"
documentation = "https://github.com/rasam08/wazuh-sysmon-triage#readme"
license = "MIT"
readme = "README.md"
keywords = ["wazuh", "sysmon", "opensearch", "incident-response", "digital-forensics", "cli"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Environment :: Console",
	"Intended Audience :: Information Technology",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.12",
	"Topic :: Security",
]
include = [
	{ path = "src/wazuh_sysmon_triage/py.typed", format = ["sdist", "wheel"] }
]

packages = [
	{ include = "wazuh_sysmon_triage", from = "src" }
]

[tool.poetry.scripts]
wazuh-sysmon-triage = "wazuh_sysmon_triage.__main__:main"
triage = "wazuh_sysmon_triage.__main__:main"

[tool.poetry.dependencies]
python = ">=3.12"
typer = "^0.27.0"
pydantic = ">=2.0"
httpx = ">=0.23.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.8"
mypy = "^1.11.0"
pre-commit = "^4.2.0"
types-PyYAML = "*"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
	"performance: bounded offline runtime and memory qualification tests",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
