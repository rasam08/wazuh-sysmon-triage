version: "3.9"

services:
  triage:
    build:
      context: .
      dockerfile: Dockerfile
    image: wazuh-sysmon-triage:latest
    container_name: wazuh-sysmon-triage
    ports:
      - "4173:4173"
    environment:
      PORT: "4173"
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASS: ${AUTH_PASS:-}
    volumes:
      - ./out:/app/out
    restart: unless-stopped
